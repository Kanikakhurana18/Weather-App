<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images.jpg" type="image/x-icon">
</head>
<body>
    <div class="back">
        <div class="card">
            <div class="search">
                <input type="text" placeholder="search for a city">
                <button id="btn"><img src="search.png" alt="search" width="10"></button>
            </div>
            <div class="weatherstatus">
                <div class="w1">
                <img src="animated/day.svg" alt="day">
                <h1 id="temp">23°C</h1>
                <h1 id="city">Delhi</h1>
                </div>
                <div class="w2">
                    <div class="humidity">
                        <img src="humidity.png" alt="humidity" width="40">
                        <h2 id="dh">20%</h2>
                        <h2 id="th">Humidity</h2>
                    </div>
                    <div class="wind">
                        <img src="wind-direction.png" alt="wind" width="40">
                        <h2 id="dw">20km/hr</h2>
                        <h2 id="tw">wind</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
